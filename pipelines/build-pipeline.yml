trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'

  webAppName: 'app-release-gate-mopo'
  sonarOrganization: 'mopodevops'
  sonarProjectKey: 'MoPoOps_azure-devsecops-release-gate'

stages:
- stage: BuildStage
  displayName: 'Build, Scan, and Package'
  jobs:
  - job: BuildJob
    steps:
    # Secret scanning (Gitleaks via Docker)
    - script: |
        docker run --volume $(Build.SourcesDirectory):/code zricethezaza/gitleaks:latest detect --source=/code --verbose
      displayName: 'Run Gitleaks Secret Scan'
      continueOnError: true

    # Prepare SAST scanning
    - task: SonarCloudPrepare@4
      displayName: 'Prepare SonarCloud analysis'
      inputs:
        SonarCloud: 'sc-sonar-connection'
        organization: '$(sonarOrganization)'
        scannerMode: 'dotnet'
        projectKey: '$(sonarProjectKey)'
        projectName: 'azure-devsecops-release-gate'

    - task: DotNetCoreCLI@2
      displayName: 'Restore dependencies'
      inputs:
        command: 'restore'
        projects: '**/*.csproj'

    # SCA dependency vulnerability scan
    - script: |
        dotnet list package --vulnerable --include-transitive
      displayName: 'Run SCA Dependency Vulnerability Scan'

    - task: DotNetCoreCLI@2
      displayName: 'Build the application'
      inputs:
        command: 'build'
        projects: '**/*.csproj'
        arguments: '--configuration $(buildConfiguration)'

    # Static source Code security scan
    - task: SonarCloudAnalyze@4
      displayName: 'Run SonarCloud Code Analysis'

    # Stop the pipeline if the quality gate fails
    - task: SonarCloudPublish@4
      displayName: 'Publish Quality Gate Result'
      inputs:
        pollingTimeoutSec: '300'

    - task: DotNetCoreCLI@2
      displayName: 'Publish and Zip'
      inputs:
        command: 'publish'
        publishWebProjects: false
        projects: '**/*.csproj'
        arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)'
        zipAfterPublish: true

    - task: PublishBuildArtifacts@1
      displayName: 'Save the Artifact'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'release-gate-drop'
        publishLocation: 'Container'

- stage: DeployStage
  displayName: 'Deploy to Azure'
  dependsOn: BuildStage
  condition: succeeded()
  jobs:
  - job: DeployJob
    steps:
    - task: DownloadBuildArtifacts@0
      displayName: 'Download the Artifact'
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: 'release-gate-drop'
        downloadPath: '$(System.ArtifactsDirectory)'

    - task: AzureWebApp@1
      displayName: 'Azure Web App Deploy'
      inputs:
        azureSubscription: 'sc-azure-connection'
        appType: 'webAppLinux'
        appName: '$(webAppName)'
        package: '$(System.ArtifactsDirectory)/release-gate-drop/*.zip'